spring.application.name=job-application-tracker-api
spring.datasource.url=jdbc:h2:mem:jobtracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Job Application Tracker API
info.app.version=1.1.0
info.app.description=Pipeline tracker for job applications
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
